<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Organic-History Simulation Viewer</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#2a313c; --fg:#d7dde5; --dim:#8b96a5; --accent:#4f9fff; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:13px/1.4 -apple-system,Segoe UI,Roboto,sans-serif; }
  #app { display:grid; grid-template-columns:1fr 320px; grid-template-rows:1fr auto;
    grid-template-areas:"map panel" "scrub panel"; height:100vh; }
  #mapwrap { grid-area:map; position:relative; overflow:hidden; background:#0a0d12; }
  #map { position:absolute; top:0; left:0; image-rendering:pixelated; cursor:crosshair; }
  #panel { grid-area:panel; background:var(--panel); border-left:1px solid var(--line);
    overflow-y:auto; padding:10px 12px; }
  #scrub { grid-area:scrub; background:var(--panel); border-top:1px solid var(--line);
    padding:8px 12px; display:flex; align-items:center; gap:10px; }
  h1 { font-size:14px; margin:0 0 8px; letter-spacing:.3px; }
  h2 { font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--dim);
    margin:14px 0 6px; border-bottom:1px solid var(--line); padding-bottom:3px; }
  button { background:#222a35; color:var(--fg); border:1px solid var(--line); border-radius:5px;
    padding:5px 9px; cursor:pointer; font-size:13px; }
  button:hover { background:#2c3744; }
  button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  input[type=range] { flex:1; }
  .layers { display:flex; flex-wrap:wrap; gap:6px; }
  .layers button { flex:1 1 46%; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th,td { text-align:right; padding:2px 4px; white-space:nowrap; }
  th { color:var(--dim); font-weight:600; cursor:pointer; }
  td.name,th.name { text-align:left; }
  .sw { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px;
    vertical-align:middle; }
  tr.dead td { opacity:.38; }
  .gauge { height:9px; background:#222a35; border-radius:5px; overflow:hidden; margin:3px 0; }
  .gauge > div { height:100%; }
  .kv { display:flex; justify-content:space-between; color:var(--dim); }
  .kv b { color:var(--fg); font-weight:600; }
  #tip { position:absolute; pointer-events:none; background:#000d; border:1px solid var(--line);
    border-radius:4px; padding:4px 7px; font-size:12px; display:none; max-width:220px; z-index:5; }
  #yr { font-variant-numeric:tabular-nums; min-width:128px; }
  .muted { color:var(--dim); }
  .pill { display:inline-block; padding:1px 6px; border-radius:9px; font-size:11px; background:#222a35; }
</style>
</head>
<body>
<div id="app">
  <div id="mapwrap"><canvas id="map"></canvas><div id="tip"></div></div>
  <div id="scrub">
    <button id="play">▶</button>
    <button id="stepb" title="step back">⟨</button>
    <button id="stepf" title="step forward">⟩</button>
    <input type="range" id="slider" min="0" max="0" value="0">
    <span id="yr" class="muted">—</span>
    <select id="speed">
      <option value="240">0.5×</option><option value="120" selected>1×</option>
      <option value="60">2×</option><option value="24">5×</option><option value="8">15×</option>
    </select>
  </div>
  <div id="panel">
    <h1>Organic-History Viewer</h1>
    <div id="status" class="muted">loading…</div>

    <h2>Layers</h2>
    <div class="layers">
      <button data-layer="territory" class="on">Territory</button>
      <button data-layer="heatmap">Pressure</button>
      <button data-layer="regions">Region control</button>
      <button data-layer="events" class="on">Mechanics</button>
    </div>
    <div id="heatsel" style="margin-top:6px; display:none;">
      <span class="muted">metric:</span>
      <select id="metric"><option value="unrest">unrest</option>
        <option value="development">development</option>
        <option value="migration">migration</option></select>
    </div>

    <h2>Steppe confederacy</h2>
    <div id="steppe" class="muted">—</div>

    <h2>Civilizations <span id="civturn" class="muted"></span></h2>
    <table id="civtab"><thead><tr>
      <th class="name" data-k="name">civ</th><th data-k="cities">cit</th>
      <th data-k="gold">gold</th><th data-k="mandate">mand</th>
      <th data-k="crisis">cris</th><th data-k="collapse_risk">clps</th>
    </tr></thead><tbody></tbody></table>
    <div style="margin-top:8px" class="muted" id="legend"></div>
  </div>
</div>
<script>
const TILE = 8;
const qs = new URLSearchParams(location.search);
const DATA = (qs.get('data') || '.').replace(/\/$/, '');
const $ = s => document.querySelector(s);
const canvas = $('#map'), ctx = canvas.getContext('2d');
const tip = $('#tip');
let MAP=null, TL=null, idx=0, playing=false, timer=null;
let terrainCanvas=null;
const layers = {territory:true, heatmap:false, regions:false, events:true};
let metric='unrest', sortK='cities', sortDir=-1;

function col(rgb, a){ return a==null ? `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`
  : `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`; }
function pcolor(id){ const p = MAP.players[id]; return p ? p.color : [170,170,170]; }

async function load(){
  try {
    const bust = `?v=${Date.now()}`;  // avoid serving a stale cached timeline on a reused port
    [MAP, TL] = await Promise.all([
      fetch(`${DATA}/map.json${bust}`, {cache:'no-store'}).then(r=>r.json()),
      fetch(`${DATA}/timeline.json${bust}`, {cache:'no-store'}).then(r=>r.json()),
    ]);
  } catch(e){ $('#status').textContent = 'failed to load map.json / timeline.json — serve this dir over http'; return; }
  canvas.width = MAP.xsize*TILE; canvas.height = MAP.ysize*TILE;
  buildTerrain();
  $('#slider').max = TL.frames.length-1;
  $('#status').innerHTML = `${TL.frames.length} turns · ${MAP.xsize}×${MAP.ysize} · ${MAP.players.length} civs`;
  fitCanvas(); draw();
}

function fitCanvas(){
  const wrap = $('#mapwrap');
  const w = wrap.clientWidth, h = wrap.clientHeight;
  const s = Math.min(w/canvas.width, h/canvas.height);
  canvas.style.width = (canvas.width*s)+'px';
  canvas.style.height = (canvas.height*s)+'px';
  canvas.style.left = ((w-canvas.width*s)/2)+'px';
  canvas.style.top = ((h-canvas.height*s)/2)+'px';
}
window.addEventListener('resize', ()=>{ if(MAP) fitCanvas(); });

function buildTerrain(){
  terrainCanvas = document.createElement('canvas');
  terrainCanvas.width = canvas.width; terrainCanvas.height = canvas.height;
  const tx = terrainCanvas.getContext('2d');
  const def=[70,80,95];
  for(let y=0;y<MAP.terrain.length;y++){
    const row = MAP.terrain[y];
    for(let x=0;x<row.length;x++){
      const c = MAP.terrainColors[row[x]] || def;
      tx.fillStyle = col(c); tx.fillRect(x*TILE, y*TILE, TILE, TILE);
    }
  }
}

function frame(){ return TL.frames[idx]; }

function draw(){
  if(!MAP||!TL) return;
  const f = frame();
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(terrainCanvas,0,0);

  // territory tint from owner grid
  if(layers.territory && f.owner){
    for(let y=0;y<f.owner.length;y++){
      const cells = f.owner[y].split(',');
      for(let x=0;x<cells.length;x++){
        const v = cells[x];
        if(v==='-') continue;
        ctx.fillStyle = col(pcolor(+v), 0.5);
        ctx.fillRect(x*TILE, y*TILE, TILE, TILE);
      }
    }
  }
  // region control markers
  if(layers.regions && f.regions){
    for(const r of f.regions){
      if(r.cx==null) continue;
      const ls = r.leader_share||0, lead = r.leader;
      const c = (lead!=null && lead>=0) ? pcolor(lead) : [150,150,150];
      const px=r.cx*TILE, py=r.cy*TILE, rad=10+ls*22;
      ctx.beginPath(); ctx.arc(px,py,rad,0,7);
      ctx.fillStyle = col(c, 0.13+0.3*ls); ctx.fill();
      ctx.strokeStyle = col(c, .7); ctx.lineWidth=1.2; ctx.stroke();
      ctx.fillStyle='#e7edf5'; ctx.font='10px sans-serif'; ctx.textAlign='center';
      ctx.fillText(`${r.id} ${(ls*100|0)}%`, px, py-rad-3);
    }
  }
  // cities
  ctx.textAlign='center';
  for(const c of f.cities){
    const px=c.x*TILE+TILE/2, py=c.y*TILE+TILE/2;
    let fill;
    if(layers.heatmap){
      const st=f.cityState[c.id]; const v = st? st[metric] : null;
      fill = v==null ? [90,90,90] : heat(v);
    } else fill = pcolor(c.owner);
    const rad = 2 + Math.min(7, c.size||1);
    ctx.beginPath(); ctx.arc(px,py,rad,0,7);
    ctx.fillStyle=col(fill); ctx.fill();
    ctx.lineWidth=1; ctx.strokeStyle= c.capital?'#fff':'#0009'; ctx.stroke();
    if(c.capital){ ctx.fillStyle='#fff'; ctx.font='bold 9px sans-serif'; ctx.fillText('★',px,py-rad-2); }
  }
  // mechanics events
  if(layers.events && f.events){
    for(const e of (f.events.friction||[])){
      if(e.x==null) continue;
      const px=e.x*TILE+TILE/2, py=e.y*TILE+TILE/2;
      ctx.beginPath(); ctx.arc(px,py,8,0,7);
      ctx.strokeStyle='rgba(255,170,40,.9)'; ctx.lineWidth=2; ctx.stroke();
    }
    for(const e of (f.events.withering||[])){
      if(e.x==null) continue;
      const px=e.x*TILE+TILE/2, py=e.y*TILE+TILE/2;
      ctx.strokeStyle = e.action==='disperse' ? 'rgba(255,60,60,.95)':'rgba(255,120,40,.9)';
      ctx.lineWidth=2; ctx.beginPath();
      ctx.moveTo(px-5,py-5); ctx.lineTo(px+5,py+5); ctx.moveTo(px+5,py-5); ctx.lineTo(px-5,py+5); ctx.stroke();
    }
  }
  updatePanel(f);
}

function heat(v){ // 0=cool blue .. 1=hot red
  v=Math.max(0,Math.min(1,v));
  const r=Math.round(40+215*v), g=Math.round(120*(1-Math.abs(v-0.5)*2)+30), b=Math.round(200*(1-v)+30);
  return [r,g,b];
}

function updatePanel(f){
  $('#yr').textContent = `T${f.turn}  ·  ${fmtYear(f.year)}`;
  $('#civturn').textContent = `T${f.turn}`;
  // steppe
  const s = f.events && f.events.steppe;
  if(s){
    $('#steppe').innerHTML =
      `<div class="kv"><span>power P</span><b>${(s.power??0).toFixed(2)}</b></div>`+
      `<div class="gauge"><div style="width:${(s.power*100||0)}%;background:#c46bff"></div></div>`+
      `<div class="kv"><span>window</span><b>${(s.window??0).toFixed(2)}</b></div>`+
      `<div class="kv"><span>neighbor fragility</span><b>${(s.fragility??0).toFixed(2)}</b></div>`;
  } else $('#steppe').innerHTML='<span class="muted">(no steppe data — logs not compiled)</span>';
  // civ table
  const rows = (f.players||[]).slice().filter(p=>p.name);
  rows.sort((a,b)=>{ let x=a[sortK], y=b[sortK]; x=x==null?-1:x; y=y==null?-1:y;
    if(typeof x==='string') return sortDir*(x>y?1:-1); return sortDir*(x-y); });
  const tb=$('#civtab tbody'); tb.innerHTML='';
  for(const p of rows){
    const tr=document.createElement('tr'); if(p.alive===false) tr.className='dead';
    tr.innerHTML = `<td class="name"><span class="sw" style="background:${col(pcolor(p.id))}"></span>${p.name}</td>`+
      `<td>${p.cities??''}</td><td>${p.gold??''}</td>`+
      `<td>${fmt(p.mandate)}</td><td>${fmt(p.crisis)}</td><td>${fmt(p.collapse_risk)}</td>`;
    tb.appendChild(tr);
  }
  $('#legend').innerHTML = legendHTML();
}
function fmt(v){ return v==null?'':v.toFixed(2); }
function fmtYear(y){ if(y==null) return ''; return y<0?`${-y} BCE`:`${y} CE`; }
function legendHTML(){
  if(layers.heatmap) return `<span class="pill">${metric}</span> low <span class="sw" style="background:${col(heat(0))}"></span>→<span class="sw" style="background:${col(heat(1))}"></span> high`;
  if(layers.regions) return `circle size & tint = leader_share; colour = leading civ`;
  if(layers.events) return `<span style="color:#ffaa28">○</span> friction tax  ·  <span style="color:#ff3c3c">✕</span> withering  ·  ★ capital`;
  return `territory tinted by owning civ · dot size = city population`;
}

// ---- controls
function go(i){ idx=Math.max(0,Math.min(TL.frames.length-1,i)); $('#slider').value=idx; draw(); }
function play(on){ playing=on; $('#play').textContent=on?'❚❚':'▶'; $('#play').classList.toggle('on',on);
  if(timer) clearInterval(timer); timer=null;
  if(on){ const ms=+$('#speed').value; timer=setInterval(()=>{ if(idx>=TL.frames.length-1){play(false);return;} go(idx+1); }, ms); } }
$('#play').onclick=()=>play(!playing);
$('#stepb').onclick=()=>{play(false);go(idx-1);};
$('#stepf').onclick=()=>{play(false);go(idx+1);};
$('#slider').oninput=e=>{play(false);go(+e.target.value);};
$('#speed').onchange=()=>{ if(playing) play(true); };
$('#metric').onchange=e=>{metric=e.target.value;draw();};
document.querySelectorAll('.layers button').forEach(b=>b.onclick=()=>{
  const L=b.dataset.layer; layers[L]=!layers[L]; b.classList.toggle('on',layers[L]);
  $('#heatsel').style.display=layers.heatmap?'block':'none'; draw();
});
document.querySelectorAll('#civtab th').forEach(th=>th.onclick=()=>{
  const k=th.dataset.k; if(sortK===k) sortDir*=-1; else {sortK=k; sortDir=(k==='name')?1:-1;} draw();
});
document.addEventListener('keydown',e=>{
  if(e.key===' '){e.preventDefault();play(!playing);} else if(e.key==='ArrowRight'){play(false);go(idx+1);}
  else if(e.key==='ArrowLeft'){play(false);go(idx-1);}
});
// hover tooltip: nearest city
canvas.onmousemove=e=>{
  if(!TL) return; const r=canvas.getBoundingClientRect();
  const mx=(e.clientX-r.left)*canvas.width/r.width, my=(e.clientY-r.top)*canvas.height/r.height;
  const f=frame(); let best=null,bd=400;
  for(const c of f.cities){ const dx=c.x*TILE+TILE/2-mx, dy=c.y*TILE+TILE/2-my; const d=dx*dx+dy*dy;
    if(d<bd){bd=d;best=c;} }
  if(best){ const st=f.cityState[best.id]; const owner=MAP.players[best.owner];
    tip.style.display='block'; tip.style.left=(e.clientX-r.left+12)+'px'; tip.style.top=(e.clientY-r.top+12)+'px';
    tip.innerHTML=`<b>${best.name}</b> ${best.capital?'★':''}<br>${owner?owner.name:''} · size ${best.size}`+
      (st?`<br>unrest ${fmt(st.unrest)} · dev ${fmt(st.development)}<br><span class="muted">${st.region||''}</span>`:'');
  } else tip.style.display='none';
};
canvas.onmouseleave=()=>tip.style.display='none';
load();
</script>
</body>
</html>
